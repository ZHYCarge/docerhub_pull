name: Sync Docker Images

on:
  # 允许在 GitHub Actions 页面手动运行
  workflow_dispatch:

  # 定时同步
  schedule:
    # GitHub Actions 使用 UTC 时间
    # UTC 19:00 = 北京时间次日凌晨 03:00
    - cron: "0 19 * * *"

permissions:
  contents: read

concurrency:
  # 避免定时任务和手动任务同时运行
  group: docker-image-sync
  cancel-in-progress: false

jobs:
  prepare:
    name: Read image configuration
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.images.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate images.json
        run: |
          set -euo pipefail

          jq empty images.json

          if [ "$(jq 'length' images.json)" -eq 0 ]; then
            echo "images.json 不能为空"
            exit 1
          fi

          jq -e '
            all(
              .[];
              (.source | type == "string" and length > 0) and
              (.target | type == "string" and length > 0) and
              (.platforms | type == "string" and length > 0)
            )
          ' images.json > /dev/null

      - name: Generate matrix
        id: images
        run: |
          {
            echo "matrix<<EOF"
            jq -c '{include: .}' images.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  sync:
    name: ${{ matrix.target }}
    needs: prepare
    runs-on: ubuntu-latest

    strategy:
      # 单个镜像失败时，继续同步其他镜像
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Show mirror information
        env:
          SOURCE_IMAGE: ${{ matrix.source }}
          TARGET_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.target }}
          PLATFORMS: ${{ matrix.platforms }}
          DESCRIPTION: ${{ matrix.description }}
        run: |
          echo "Source:      ${SOURCE_IMAGE}"
          echo "Target:      ${TARGET_IMAGE}"
          echo "Platforms:   ${PLATFORMS}"
          echo "Description: ${DESCRIPTION}"

      - name: Create mirror Dockerfile
        env:
          SOURCE_IMAGE: ${{ matrix.source }}
        run: |
          cat > Dockerfile.mirror <<'EOF'
          ARG SOURCE_IMAGE
          FROM ${SOURCE_IMAGE}

          ARG SOURCE_IMAGE
          ARG DESCRIPTION
          ARG SOURCE_REPOSITORY
          ARG SYNC_TIME

          LABEL org.opencontainers.image.title="Docker image mirror" \
                org.opencontainers.image.description="${DESCRIPTION}" \
                org.opencontainers.image.source="${SOURCE_REPOSITORY}" \
                org.opencontainers.image.url="${SOURCE_REPOSITORY}" \
                org.opencontainers.image.created="${SYNC_TIME}" \
                io.github.image-mirror.upstream="${SOURCE_IMAGE}"
          EOF

      - name: Build and push mirror
        env:
          SOURCE_IMAGE: ${{ matrix.source }}
          TARGET_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.target }}
          PLATFORMS: ${{ matrix.platforms }}
          DESCRIPTION: ${{ matrix.description }}
          SOURCE_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail

          SYNC_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          docker buildx build \
            --platform "${PLATFORMS}" \
            --build-arg "SOURCE_IMAGE=${SOURCE_IMAGE}" \
            --build-arg "DESCRIPTION=${DESCRIPTION}" \
            --build-arg "SOURCE_REPOSITORY=${SOURCE_REPOSITORY}" \
            --build-arg "SYNC_TIME=${SYNC_TIME}" \
            --tag "${TARGET_IMAGE}" \
            --file Dockerfile.mirror \
            --provenance=false \
            --push \
            .
